<h1 mat-dialog-title>
  <mat-icon class="{{data?.iconClass}}">{{data?.icon}}</mat-icon>
  {{data?.title}}
</h1>
<div mat-dialog-content>
  {{data?.message}}
</div>
<div mat-dialog-actions>
  @if (data?.buttonText && data?.buttonText != '') {
    <button mat-button class="angular-text-upper {{data?.buttonClass ?? 'angular-btn-primary'}}" (click)="onClose()" cdkFocusInitial>{{data?.buttonText}}</button>
  }
</div>
